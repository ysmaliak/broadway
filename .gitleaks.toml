[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[0-9a-f]{64}\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{52}\b'''
keywords = ["gsk_"]

[[rules]]
id = "gemini-auth-key"
description = "Google AI Studio auth key (the newer AQ. form)"
regex = '''\bAQ\.[A-Za-z0-9_\-]{30,}'''
keywords = ["AQ."]

[allowlist]
description = "Sparkle's public EdDSA key, which every shipped copy carries, and a test's stand-in for a key"
regexes = ['''nxl83C8RF5QYop3e8\+ObGP7dHn4HZ3NanZmdjG8HPME=''', '''^bm90IGEga2V5$''']
